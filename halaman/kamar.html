<section class="halaman-kamar">
  <h2>Kamar Tersedia</h2>
  <p class="sub">
    Kamar yang masih kosong dan siap dihuni. Hubungi pemilik untuk survei.
  </p>

  <div class="filter" role="search">
    <label class="f-cari"
      >Cari
      <input
        type="search"
        id="cariKamar"
        placeholder="Nomor kamar atau fasilitas, mis. AC"
      />
    </label>

    <label
      >Tipe
      <select id="filterTipe">
        <option value="">Semua tipe</option>
        <option value="Standar">Standar</option>
        <option value="Deluxe">Deluxe</option>
        <option value="VIP">VIP</option>
      </select>
    </label>

    <label
      >Harga maksimal: <output id="labelHarga"></output>
      <input
        type="range"
        id="filterHarga"
        min="500000"
        max="1500000"
        step="50000"
        value="1500000"
      />
    </label>

    <label
      >Urutkan
      <select id="urutKamar">
        <option value="murah">Harga termurah</option>
        <option value="mahal">Harga termahal</option>
      </select>
    </label>

    <button type="button" id="resetFilter" class="btn-reset">Reset</button>
  </div>

  <p id="jumlahKamar" class="jumlah" aria-live="polite"></p>
  <div id="daftarKamar" class="grid-kamar"></div>

  <div id="modalKamar" class="modal" hidden>
    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalJudul"
    >
      <button
        type="button"
        class="modal-tutup"
        id="tutupModal"
        aria-label="Tutup"
      >
        &times;
      </button>
      <div id="modalIsi"></div>
    </div>
  </div>
</section>
